# Semantic map for the Event Guide Robot demo.
#
# Coordinate source:
# - Positions match worlds/event_fair.world and maps/event_fair_map.yaml.
# - The simulated fair is an asymmetric 3x3 building: all nine logical cells
#   are connected, but two pairs are merged into larger halls and the
#   top-right room has a single entrance.
# - Final orientation is intentionally relaxed in the navigation launches via
#   move_base yaw_goal_tolerance. The robot should reach the zone, then rotate
#   locally until the requested ArUco marker is visible.
# - labels use ArUco/AprilTag-style numeric marker IDs as the primary visual
#   signal. Print one marker per stand and place it next to the human-readable
#   stand name. Colors can be added physically as a secondary debugging cue, but
#   they are not the semantic identifier.

metadata:
  frame_id: map
  map_file: ../maps/event_fair_map.yaml
  position_source: generated_event_fair_simulation
  yaw_source: relaxed_by_move_base_yaw_goal_tolerance
  centroid:
    x: 0.0
    y: 0.0

zones:
  zona_arriba:
    name: "Zona arriba"
    aliases:
      - "arriba"
      - "zona arriba"
      - "punto arriba"
    nav_goal:
      x: -0.25
      y: 3.55
      yaw: 1.57079632679
    search_waypoints:
      - x: -1.25
        y: 4.55
        yaw: 1.57079632679
      - x: -5.05
        y: 3.55
        yaw: 3.14159265359
    labels:
